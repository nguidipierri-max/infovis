<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>TP1 - Restaurantes Visitados</title>
  <style>
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: #F1E2CC;
      color: #2E2A24;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 950px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 2.4em;
      color: #B7472A;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 1.05em;
      color: #6B5B4D;
      font-style: italic;
    }
    .card {
      background-color: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
      margin-bottom: 30px;
    }
    .card h2 {
      font-size: 1.5em;
      color: #2E2A24;
      margin-top: 0;
    }
    .credit {
      font-size: 0.85em;
      color: #A08F7D;
      font-style: italic;
      margin-top: 14px;
      margin-bottom: 0;
    }
    iframe, object {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      border-radius: 8px;
    }
    footer {
      text-align: center;
      font-size: 0.85em;
      color: #A08F7D;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍽️ Restaurantes Visitados</h1>
      <p class="subtitle">Una exploración visual de mis salidas a comer en Buenos Aires</p>
    </header>

    <div class="card">
      <iframe title="¿Pagar más garantiza mejor puntuación?" aria-label="Scatter Plot" id="datawrapper-chart-WCKpT" src="https://datawrapper.dwcdn.net/WCKpT/1/" scrolling="no" frameborder="0" style="border: none;" width="900" height="575" data-external="1"></iframe>
    </div>

    <div class="card">
      <h2>¿En qué barrios se va más de mi plata al salir a comer?</h2>
      <object type="image/svg+xml" data="./treemap.svg" width="900"></object>
      <p class="credit">Gráfico hecho por Niccolina Guidi Pierri con RAWGraphs · Fuente: registro personal</p>
    </div>

    <footer>
      TP1 — Visualización de Datos Personales · ITBA 2026
    </footer>
  </div>
</body>
</html>
